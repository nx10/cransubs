<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="apple-touch-icon" sizes="180x180" href="/cransubs/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/cransubs/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/cransubs/favicon-16x16.png" />
		<link rel="manifest" href="/cransubs/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			(function () {
				var theme = localStorage.getItem('cransubs-theme');
				var dark =
					theme === 'dark' ||
					(theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
